<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 营养师工作台</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: #e5e5e5; border-radius: 10px; }
    </style>
</head>
<body class="bg-white h-screen flex overflow-hidden text-gray-900">

    <!-- 左侧：用户画像面板 -->
    <aside class="w-72 bg-[#fafafa] border-r border-gray-100 flex flex-col hidden md:flex">
        <div class="p-8 border-b border-gray-100">
            <h2 class="text-xs font-semibold text-gray-400 uppercase tracking-widest mb-6">Health Profile</h2>
            <div id="userProfile" class="space-y-4 text-sm">
                <!-- 动态填入 -->
            </div>
        </div>
        <div class="p-8">
            <button class="w-full text-center px-4 py-3 border border-black text-black hover:bg-black hover:text-white rounded-lg transition-colors text-sm font-medium">
                + 记录今日饮食
            </button>
        </div>
    </aside>

    <!-- 右侧：对话主区域 -->
    <main class="flex-1 flex flex-col h-full bg-white relative">
        <!-- 顶部 -->
        <header class="h-20 border-b border-gray-100 flex items-center px-8 bg-white/80 backdrop-blur-sm sticky top-0">
            <h1 class="text-lg font-semibold tracking-tight">AI 营养师</h1>
            <span class="ml-3 px-2 py-1 border border-gray-200 text-gray-500 text-[10px] rounded uppercase tracking-wider">Online</span>
        </header>

        <!-- 聊天记录 -->
        <div id="chatArea" class="flex-1 overflow-y-auto p-8 space-y-8 max-w-4xl w-full mx-auto">
            <!-- AI 欢迎语 -->
            <div class="flex items-start gap-4">
                <div class="w-8 h-8 bg-black rounded-full flex items-center justify-center text-white text-xs shrink-0">AI</div>
                <div class="border border-gray-100 bg-[#fafafa] p-5 rounded-2xl rounded-tl-sm text-gray-700 max-w-[80%] text-sm leading-relaxed shadow-sm">
                    您好。我是您的专属营养师。请告诉我您今天吃了什么，或上传食物照片，我将为您进行营养评估。
                </div>
            </div>
        </div>

        <!-- 底部输入区 -->
        <div class="p-6 border-t border-gray-100 bg-white">
            <div class="flex items-center gap-2 max-w-4xl mx-auto bg-gray-50 border border-gray-200 rounded-xl p-2 focus-within:border-black focus-within:ring-1 focus-within:ring-black focus-within:bg-white transition-all">
                <button class="p-2 text-gray-400 hover:text-black transition-colors rounded-lg hover:bg-gray-100" title="上传图片" onclick="simulateImageUpload()">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
                </button>
                <input type="text" id="chatInput" class="flex-1 bg-transparent outline-none text-sm placeholder-gray-400 px-2" placeholder="输入您的饮食记录...">
                <button onclick="sendMessage()" class="bg-black hover:bg-gray-800 text-white px-6 py-2.5 rounded-lg text-sm font-medium transition-all active:scale-[0.98]">
                    发送
                </button>
            </div>
        </div>
    </main>

    <script>
        window.onload = function() {
            const storedData = localStorage.getItem('userHealthData');
            if (storedData) {
                const data = JSON.parse(storedData);
                const heightM = data.height / 100;
                const bmi = (data.weight / (heightM * heightM)).toFixed(1);
                
                // 用黑白灰风格渲染数据
                document.getElementById('userProfile').innerHTML = `
                    <div class="flex justify-between items-center border-b border-gray-100 pb-3"><span class="text-gray-400">身高</span> <span class="font-medium text-black">${data.height} cm</span></div>
                    <div class="flex justify-between items-center border-b border-gray-100 pb-3"><span class="text-gray-400">体重</span> <span class="font-medium text-black">${data.weight} kg</span></div>
                    <div class="flex justify-between items-center border-b border-gray-100 pb-3"><span class="text-gray-400">BMI</span> <span class="font-medium ${bmi > 24 ? 'text-black underline decoration-wavy underline-offset-4' : 'text-black'}">${bmi}</span></div>
                    <div class="flex flex-col pt-2"><span class="text-gray-400 text-xs mb-2">重点疾病</span> <span class="border border-gray-200 text-black px-3 py-1 rounded-md inline-block text-center bg-white">${data.diseases}</span></div>
                `;
            }
        };

        function sendMessage() {
            const input = document.getElementById('chatInput');
            const text = input.value.trim();
            if (!text) return;
            appendMessage('user', text);
            input.value = '';
            setTimeout(() => {
                const diseases = JSON.parse(localStorage.getItem('userHealthData')).diseases;
                appendMessage('ai', `【AI模拟】：收到。针对您的「${diseases}」情况，我正在计算该餐的升糖指数与钠含量。建议您保持清淡饮食。（待接入真实AI大模型）`);
            }, 1000);
        }

        function simulateImageUpload() {
            appendMessage('user', '📷 [已上传图片：西红柿炒鸡蛋]');
            setTimeout(() => {
                appendMessage('ai', "识别成功。请选择大致分量，以便精确计算：<br><br> <button class='border border-gray-300 px-4 py-2 rounded-lg text-xs hover:border-black transition-colors'>半盘 (~150g)</button> <button class='ml-2 border border-gray-300 px-4 py-2 rounded-lg text-xs hover:border-black transition-colors'>整盘 (~300g)</button>");
            }, 1500);
        }

        function appendMessage(role, text) {
            const chatArea = document.getElementById('chatArea');
            const msgDiv = document.createElement('div');
            
            if (role === 'user') {
                msgDiv.className = 'flex items-start gap-4 flex-row-reverse';
                msgDiv.innerHTML = `
                    <div class="w-8 h-8 bg-gray-200 text-gray-600 rounded-full flex items-center justify-center text-xs shrink-0">我</div>
                    <div class="bg-black text-white p-5 rounded-2xl rounded-tr-sm max-w-[80%] text-sm leading-relaxed">
                        ${text}
                    </div>
                `;
            } else {
                msgDiv.className = 'flex items-start gap-4';
                msgDiv.innerHTML = `
                    <div class="w-8 h-8 bg-black rounded-full flex items-center justify-center text-white text-xs shrink-0">AI</div>
                    <div class="border border-gray-100 bg-[#fafafa] p-5 rounded-2xl rounded-tl-sm text-gray-700 max-w-[80%] text-sm leading-relaxed shadow-sm">
                        ${text}
                    </div>
                `;
            }
            chatArea.appendChild(msgDiv);
            chatArea.scrollTop = chatArea.scrollHeight;
        }
    </script>
</body>
</html>
